[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oilinfl"
version = "1.0.0"
description = "Oil shocks, US CPI/PCE inflation, inflation expectations and real yields: ARDL scenario model with robustness tests"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "statsmodels>=0.14", "scipy>=1.10", "matplotlib>=3.7", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
